# CI: the skills against the Agent Skills spec, the plugin manifests against their clients, and,
# on main, the release branch every install fetches.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check skills and manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes exact tags only, no floating major.
      - uses: astral-sh/setup-uv@v10.3.0

      # Claude Code's validator needs Node 22 or later, and no credentials.
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.292

      - name: Run the gate
        run: make check

  lint-workflows:
    name: lint workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --status
          tar -xzf "$tarball" actionlint

      - name: actionlint
        run: ./actionlint -color

  # Every install fetches the release branch, so a person downloads what an agent loads and
  # nothing else: no evals, scaffold scripts, Makefile or workflows.
  publish:
    name: publish the plugin to the release branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, lint-workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The one job that pushes, and only to the release branch.
          persist-credentials: true

      - name: Publish what ships
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release="$RUNNER_TEMP/release"
          # Each publish is a commit on the last, so a clone's `git pull` fast-forwards.
          if git fetch --depth 1 origin release; then
            git worktree add -b release "$release" FETCH_HEAD
          else
            git worktree add --orphan -b release "$release"
          fi
          git -C "$release" rm -rq --ignore-unmatch .
          cp -a .claude-plugin .codex-plugin .cursor-plugin plugin.json skills LICENSE NOTICE "$release/"
          git -C "$release" add -A
          if git -C "$release" diff --cached --quiet; then
            echo "The release branch already holds this commit's plugin."
            exit 0
          fi
          git -C "$release" commit -q -m "$(git log -1 --format=%s)" -m "Published from ${GITHUB_SHA}."
          git -C "$release" push origin release

  ci-status:
    name: CI status
    if: always()
    needs: [check, lint-workflows, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every job passed
        env:
          NEEDS: ${{ toJson(needs) }}
        run: jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< "$NEEDS"
